name: forestry_trees
title: Forestry Tree Points
description: >-
  NYC Parks inventory of every street tree, stump and retired planting location,
  continuously maintained by the Forestry Management System.
source:
  type: socrata
  domain: data.cityofnewyork.us
  id: hn5i-inap
  select: [objectid, dbh, tpstructure, tpcondition, genusspecies, planteddate,
           createddate, updateddate, riskrating, location]
  order: objectid

refresh:
  strategy: full          # re-pull everything when the source reports an update
  min_interval_hours: 24

key: objectid

# Typed staging table. {raw} is replaced with the deduplicated raw snapshot.
# Must produce `key` and a point `geom` (EPSG:4326, lon/lat).
staging: |
  SELECT
    CAST(objectid AS BIGINT)                          AS key,
    TRY_CAST(dbh AS DOUBLE)                           AS dbh,
    tpstructure                                       AS structure,
    tpcondition                                       AS condition,
    genusspecies                                      AS species,
    TRY_CAST(left(planteddate, 19) AS TIMESTAMP)      AS planted_at,
    TRY_CAST(left(createddate, 19) AS TIMESTAMP)      AS created_at,
    riskrating                                        AS risk_rating,
    ST_GeomFromText(location)                         AS geom
  FROM {raw}
  WHERE location IS NOT NULL

features:
  - id: trees_live
    title: Live trees
    agg: count(*)
    filter: structure = 'Full' AND condition <> 'Dead'
    fill: 0
    unit: trees
    normalize: [area, capita]

  - id: trees_planted_5y
    title: Trees planted, last 5 years
    agg: count(*)
    filter: planted_at >= current_date - INTERVAL 5 YEAR
    fill: 0
    unit: trees
    normalize: [area, capita]

  - id: trees_stumps
    title: Stumps (unreplaced removals)
    agg: count(*)
    filter: structure LIKE 'Stump%'
    fill: 0
    unit: stumps
    normalize: [area, capita]

  - id: trees_mean_dbh
    title: Mean trunk diameter (live)
    agg: avg(dbh)
    filter: structure = 'Full' AND condition <> 'Dead' AND dbh > 0 AND dbh < 100
    unit: inches

  - id: trees_pct_poor
    title: Share of live trees in poor/critical condition
    agg: avg(CASE WHEN condition IN ('Poor', 'Critical') THEN 1.0 ELSE 0.0 END)
    filter: structure = 'Full' AND condition NOT IN ('Dead', 'Unknown')
    unit: fraction

  - id: trees_species_richness
    title: Distinct species (live)
    agg: count(DISTINCT species)
    filter: structure = 'Full' AND condition <> 'Dead'
    fill: 0
    unit: species
