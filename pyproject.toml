[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "city-fabric"
version = "0.1.0"
description = "Collect, geographically pivot, visualize and analyze NYC urban datasets."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.31",
    "pyyaml>=6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
analysis = [
    "jupyter",
    "matplotlib",
    "seaborn",
    "scipy",
    "statsmodels",
]
dev = ["pytest", "httpx", "nbformat", "nbconvert"]

[project.scripts]
cf = "city_fabric.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
city_fabric = ["viz/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
